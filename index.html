<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAMHUB - Movie & TV Discovery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b0c10; color: #ffffff; overflow-x: hidden; }
        
        /* Navbar */
        nav { position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(11, 12, 16, 0.92); backdrop-filter: blur(10px); border-bottom: 1px solid #1f2833; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 22px; font-weight: 900; color: #e50914; text-decoration: none; letter-spacing: 1px; }
        .logo span { color: #ffffff; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links button { background: none; border: none; color: #c5c6c7; font-size: 14px; font-weight: 600; cursor: pointer; }
        .nav-links button:hover { color: #ffffff; }
        .search-box input { background: #1f2833; border: 1px solid #45a29e; color: #fff; padding: 7px 15px; border-radius: 20px; font-size: 14px; outline: none; width: 200px; }

        /* Hero Section */
        #hero-section { position: relative; height: 75vh; width: 100%; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 40px 24px; margin-top: 50px; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, #0b0c10 10%, rgba(11,12,16,0.5) 60%, rgba(11,12,16,0.2) 100%); }
        .hero-content { position: relative; z-index: 10; max-width: 650px; }
        .badge { background: #e50914; color: #fff; font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }
        #hero-title { font-size: 36px; font-weight: 800; margin: 10px 0; line-height: 1.2; }
        .hero-meta { display: flex; gap: 15px; font-size: 14px; color: #66fcf1; font-weight: bold; margin-bottom: 12px; }
        #hero-overview { color: #d1d5db; font-size: 14px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 20px; }
        .hero-btns { display: flex; gap: 12px; }
        .btn-play { background: #e50914; color: #fff; border: none; padding: 10px 22px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .btn-list { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid #666; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }

        /* Movie Rows & Cards */
        #sections-container { padding: 20px 24px; }
        .row { margin-bottom: 35px; }
        .row h2 { font-size: 20px; margin-bottom: 15px; color: #fff; border-left: 4px solid #e50914; padding-left: 10px; }
        .row-cards { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .row-cards::-webkit-scrollbar { display: none; }
        
        .card { min-width: 155px; max-width: 155px; background: #1f2833; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; position: relative; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 230px; object-fit: cover; display: block; }
        .card-rating { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.85); color: #facc15; font-size: 11px; font-weight: bold; padding: 3px 6px; border-radius: 4px; }
        .card-info { padding: 10px; }
        .card-title { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-type { font-size: 11px; color: #9ca3af; text-transform: uppercase; margin-top: 3px; }

        /* Grid View */
        #grid-container { padding: 80px 24px 30px; display: none; }
        .grid-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        #grid-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
        #grid-items .card { min-width: 100%; max-width: 100%; }

        /* Player Modal */
        #player-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 200; display: none; align-items: center; justify-content: center; padding: 15px; }
        .modal-box { background: #1f2833; width: 100%; max-width: 800px; border-radius: 10px; overflow: hidden; }
        .modal-header { padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #374151; }
        .close-btn { background: none; border: none; color: #fff; font-size: 26px; cursor: pointer; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .modal-footer { padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #9ca3af; }

        footer { border-top: 1px solid #1f2833; padding: 25px; text-align: center; color: #6b7280; font-size: 12px; margin-top: 40px; }
    </style>
</head>
<body>

    <nav>
        <a href="#" onclick="resetHome()" class="logo">STREAM<span>HUB</span></a>
        <div class="nav-links">
            <button onclick="resetHome()">Home</button>
            <button onclick="fetchCategory('movie/popular', 'Popular Movies')">Movies</button>
            <button onclick="fetchCategory('tv/popular', 'TV Series')">Series</button>
            <button onclick="showWatchlist()">My List (<span id="list-count">0</span>)</button>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" onkeyup="handleSearch(event)" placeholder="Search movies...">
        </div>
    </nav>

    <section id="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <span class="badge">Trending #1</span>
            <h1 id="hero-title">Loading Movies...</h1>
            <div class="hero-meta">
                <span id="hero-rating">★ 0.0</span>
                <span id="hero-date">2026</span>
                <span>HD</span>
            </div>
            <p id="hero-overview">Please wait while we fetch the latest movies...</p>
            <div class="hero-btns">
                <button id="hero-watch-btn" class="btn-play">▶ Watch Trailer</button>
                <button id="hero-list-btn" class="btn-list">+ My List</button>
            </div>
        </div>
    </section>

    <div id="sections-container"></div>

    <div id="grid-container">
        <div class="grid-header">
            <h2 id="grid-title">Results</h2>
            <button onclick="resetHome()" class="btn-play" style="padding: 6px 14px; font-size: 13px;">Back Home</button>
        </div>
        <div id="grid-items"></div>
    </div>

    <div id="player-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title" style="font-size: 16px;">Trailer</h3>
                <button onclick="closeModal()" class="close-btn">&times;</button>
            </div>
            <div class="video-wrapper">
                <iframe id="video-iframe" src="" frameborder="0" allowfullscreen></iframe>
            </div>
            <div class="modal-footer">
                <span>Official YouTube Trailer</span>
                <button id="modal-list-btn" class="btn-list" style="padding: 5px 12px; font-size: 12px;">+ Add to My List</button>
            </div>
        </div>
    </div>

    <footer>
        <p style="color: #fff; font-weight: bold; margin-bottom: 5px;">STREAMHUB • Movie & TV Discovery</p>
        <p>Powered by TMDB API. Trailers streamed via YouTube.</p>
    </footer>
    <script>
        const API_KEY = '55a539170381681f8819be75900765d2';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const BACKDROP_URL = 'https://image.tmdb.org/t/p/original';

        let watchlist = JSON.parse(localStorage.getItem('myWatchlist')) || [];

        document.addEventListener('DOMContentLoaded', function() {
            updateWatchlistCount();
            loadHomePage();
        });

        async function loadHomePage() {
            const trending = await fetchData('/trending/all/day');
            if (trending && trending.results && trending.results.length > 0) {
                const firstItem = trending.results.shift();
                setupHero(firstItem);
            }

            const container = document.getElementById('sections-container');
            container.innerHTML = '';

            const categories = [
                { title: 'Trending Now', endpoint: '/trending/all/week' },
                { title: 'Popular Movies', endpoint: '/movie/popular' },
                { title: 'Top Rated TV Series', endpoint: '/tv/top_rated' },
                { title: 'Action & Sci-Fi', endpoint: '/discover/movie?with_genres=28,878' },
                { title: 'Anime & Animation', endpoint: '/discover/tv?with_genres=16' }
            ];

            for (let i = 0; i < categories.length; i++) {
                const data = await fetchData(categories.at(i).endpoint);
                if (data && data.results) {
                    renderRow(categories.at(i).title, data.results, container);
                }
            }
        }

        async function fetchData(endpoint) {
            const sep = endpoint.includes('?') ? '&' : '?';
            try {
                const res = await fetch(BASE_URL + endpoint + sep + 'api_key=' + API_KEY);
                return await res.json();
            } catch (err) {
                console.error(err);
                return null;
            }
        }

        function setupHero(item) {
            const hero = document.getElementById('hero-section');
            const title = item.title || item.name;
            const dateStr = item.release_date || item.first_air_date || '';
            const year = dateStr.substring(0, 4);
            const mediaType = item.media_type || (item.title ? 'movie' : 'tv');

            if (item.backdrop_path) {
                hero.style.backgroundImage = "url('" + BACKDROP_URL + item.backdrop_path + "')";
            }
            document.getElementById('hero-title').innerText = title;
            document.getElementById('hero-rating').innerText = '★ ' + (item.vote_average ? item.vote_average.toFixed(1) : '8.0');
            document.getElementById('hero-date').innerText = year;
            document.getElementById('hero-overview').innerText = item.overview || '';

            document.getElementById('hero-watch-btn').onclick = function() { openPlayer(item.id, mediaType, title, item); };
            document.getElementById('hero-list-btn').onclick = function() { toggleWatchlist(item); };
        }

        function renderRow(title, items, container) {
            const section = document.createElement('div');
            section.className = 'row';
            let cardsHTML = '';
            for (let i = 0; i < items.length; i++) {
                cardsHTML += createCardHTML(items.at(i));
            }
            section.innerHTML = '<h2>' + title + '</h2><div class="row-cards">' + cardsHTML + '</div>';
            container.appendChild(section);
        }

        function createCardHTML(item) {
            if (!item || !item.poster_path) return '';
            const title = item.title || item.name;
            const mediaType = item.media_type || (item.title ? 'movie' : 'tv');
            const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
            const itemString = encodeURIComponent(JSON.stringify(item));
            const safeTitle = title.replace(/'/g, "\\'");

            return '<div class="card" onclick="openPlayer(' + item.id + ', \'' + mediaType + '\', \'' + safeTitle + '\', \'' + itemString + '\')">' +
                '<img src="' + IMG_URL + item.poster_path + '" alt="' + safeTitle + '">' +
                '<div class="card-rating">★ ' + rating + '</div>' +
                '<div class="card-info">' +
                '<div class="card-title">' + title + '</div>' +
                '<div class="card-type">' + mediaType + '</div>' +
                '</div></div>';
        }

        async function openPlayer(id, type, title, itemData) {
            const modal = document.getElementById('player-modal');
            const iframe = document.getElementById('video-iframe');
            document.getElementById('modal-title').innerText = title;
            modal.style.display = 'flex';

            const videos = await fetchData('/' + type + '/' + id + '/videos');
            let trailer = null;
            if (videos && videos.results && videos.results.length > 0) {
                trailer = videos.results.find(function(v) { return v.type === 'Trailer' && v.site === 'YouTube'; }) || videos.results.at(0);
            }

            if (trailer && trailer.key) {
                iframe.src = 'https://youtube.com' + trailer.key + '?autoplay=1';
            } else {
                iframe.src = '';
                alert('দুঃখিত, এই মুভিটির ট্রেইলার পাওয়া যায়নি।');
            }

            const parsedItem = typeof itemData === 'string' ? JSON.parse(decodeURIComponent(itemData)) : itemData;
            document.getElementById('modal-list-btn').onclick = function() { toggleWatchlist(parsedItem); };
        }

        function closeModal() {
            document.getElementById('player-modal').style.display = 'none';
            document.getElementById('video-iframe').src = '';
        }

        let searchTimeout;
        function handleSearch(event) {
            clearTimeout(searchTimeout);
            const query = event.target.value.trim();
            if (query.length < 2) {
                if (query.length === 0) resetHome();
                return;
            }
            searchTimeout = setTimeout(async function() {
                const data = await fetchData('/search/multi?query=' + encodeURIComponent(query));
                if (data && data.results) {
                    showGrid('Search: ' + query, data.results);
                }
            }, 500);
        }

        async function fetchCategory(endpoint, title) {
            const data = await fetchData('/' + endpoint);
            if (data && data.results) {
                showGrid(title, data.results);
            }
        }

        function showGrid(title, items) {
            document.getElementById('hero-section').style.display = 'none';
            document.getElementById('sections-container').style.display = 'none';
            const gridContainer = document.getElementById('grid-container');
            gridContainer.style.display = 'block';
            document.getElementById('grid-title').innerText = title;
            let html = '';
            for (let i = 0; i < items.length; i++) {
                html += createCardHTML(items.at(i));
            }
            document.getElementById('grid-items').innerHTML = html;
        }

        function resetHome() {
            document.getElementById('searchInput').value = '';
            document.getElementById('grid-container').style.display = 'none';
            document.getElementById('hero-section').style.display = 'flex';
            document.getElementById('sections-container').style.display = 'block';
        }

        function toggleWatchlist(item) {
            const exists = watchlist.some(function(w) { return w.id === item.id; });
            if (exists) {
                watchlist = watchlist.filter(function(w) { return w.id !== item.id; });
                alert('Removed from My List');
            } else {
                watchlist.push(item);
                alert('Added to My List!');
            }
            localStorage.setItem('myWatchlist', JSON.stringify(watchlist));
            updateWatchlistCount();
        }

        function updateWatchlistCount() {
            document.getElementById('list-count').innerText = watchlist.length;
        }

        function showWatchlist() {
            showGrid('My Watchlist', watchlist);
        }
    </script>
</body>
</html>
